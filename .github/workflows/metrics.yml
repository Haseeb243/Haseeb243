name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches:
      - main                # regenerate on profile changes
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

# Each metrics card runs in its own job with its own 20-minute budget so a slow
# plugin can never starve the others. Jobs are chained with `needs:` so the
# committer steps push to main one at a time and never collide on the same file.
#
# NOTE: The `habits` and `achievements` plugins were intentionally removed
# because they emit "Unexpected error" when the workflow falls back to the
# default GITHUB_TOKEN (they need a fine-grained PAT). The trophy card and the
# demolab streak card already cover the same ground without any PAT setup.
# To re-enable them: add a `METRICS_TOKEN` PAT (`repo` + `read:org` + `read:user`)
# at https://github.com/Haseeb243/Haseeb243/settings/secrets/actions, then add
# back jobs analogous to `terminal` referencing `plugin_habits` / `plugin_achievements`.

jobs:
  overview:
    name: Overview metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, sass
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          retries: 2
          retries_delay: 30

  terminal:
    name: Terminal metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: overview
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: ""
          config_timezone: Asia/Karachi
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
          retries: 2
          retries_delay: 30

