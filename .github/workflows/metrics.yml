name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches:
      - main                # regenerate on profile changes
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

# Each metrics card runs in its own job with its own 20-minute budget so a slow
# plugin can never starve the others. Jobs are chained with `needs:` so the
# committer steps push to main one at a time and never collide on the same file.

jobs:
  overview:
    name: Overview metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, sass
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          retries: 2
          retries_delay: 30

  terminal:
    name: Terminal metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: overview
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: ""
          config_timezone: Asia/Karachi
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12
          retries: 2
          retries_delay: 30

  habits:
    name: Habits metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: terminal
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.habits.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          retries: 2
          retries_delay: 30

  achievements:
    name: Achievements metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: habits
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          retries: 2
          retries_delay: 30
