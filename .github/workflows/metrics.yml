name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    branches:
      - main                # regenerate on profile changes
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Main metrics card with overview stats, isocalendar and language usage.
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Karachi
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, sass
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8

      # Terminal-style introduction card.
      - name: Terminal metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: ""
          config_timezone: Asia/Karachi
          plugin_introduction: yes
          plugin_introduction_title: yes
          plugin_lines: yes
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 12

      # Habits / productive time card.
      - name: Habits metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.habits.svg
          base: ""
          config_timezone: Asia/Karachi
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

      # Achievements showcase card.
      - name: Achievements metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Haseeb243
          filename: metrics/metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
